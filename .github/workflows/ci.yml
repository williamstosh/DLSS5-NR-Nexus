name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source form
        shell: pwsh
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./tools/check-version.ps1 | Out-Null
          $base = $env:DIFF_BASE
          if (-not $base -or $base -cmatch '\A0{40}\z') {
            # New refs and manual runs have no before SHA.
            $base = git rev-parse --verify --quiet 'HEAD^1'
          }
          if ($base) {
            if ($base -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Invalid source diff base.' }
            git diff --check $base HEAD --
          } else {
            git diff-tree --root --check -r HEAD
          }
          if ($LASTEXITCODE -ne 0) { throw 'Source diff format check failed.' }
