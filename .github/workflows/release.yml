name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact-tree branch core evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci-evidence.ps1 -Mode Release
  build:
    needs: evidence
    uses: ./.github/workflows/build-windows.yml
    with:
      run_core: false
      expected_tag: ${{ github.ref_name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist
      - name: Prepare verified draft assets for final acceptance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCHIVE: ${{ needs.build.outputs.archive_name }}
        run: |
          ./tools/publish-release.ps1 -Tag $env:RELEASE_TAG -ArchivePath (Join-Path dist $env:RELEASE_ARCHIVE) -DraftOnly
